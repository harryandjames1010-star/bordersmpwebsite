<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Border SMP</title>

<link rel="icon" href="https://api.powerupstack.net/cdn/instances/019e3a8b-cbfe-7c85-88c1-54cb9116d811/icon.png?v=14056678284652727b017bb54578441c214fcd1ba38d964c056cbba958420865">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
}

header {
    background: #1a1a1a;
    padding: 30px;
    border-bottom: 4px solid #00aa00;
}

.logo {
    width: 180px;
    border-radius: 20px;
}

h1 {
    color: #00ff55;
}

.box {
    background: #222;
    width: 90%;
    max-width: 700px;
    margin: 20px auto;
    padding: 20px;
    border-radius: 12px;
}

.ip {
    font-size: 24px;
    color: #00ff55;
    font-weight: bold;
}

button {
    background: #00aa00;
    color: white;
    border: none;
    padding: 12px 24px;
    font-size: 18px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #00cc00;
}

#countdown {
    font-size: 32px;
    color: #ffd700;
    font-weight: bold;
}

ul {
    text-align: left;
    display: inline-block;
    font-size: 20px;
}
</style>
</head>

<body>

<header>
    <img class="logo"
    src="https://api.powerupstack.net/cdn/instances/019e3a8b-cbfe-7c85-88c1-54cb9116d811/icon.png?v=14056678284652727b017bb54578441c214fcd1ba38d964c056cbba958420865"
    alt="Border SMP Logo">

    <h1>Border SMP</h1>
    <p>750x750 Survival Minecraft Server</p>
</header>

<div class="box">
    <h2>Server IP</h2>
    <div class="ip">thebordersmp.progamer.me</div>
    <br>
    <button onclick="copyIP()">Copy IP</button>
</div>

<div class="box">
    <h2>Server Launch Countdown</h2>
    <div id="countdown">Loading...</div>
</div>

<div class="box">
    <h2>Server Information</h2>
    <ul>
        <li>🌍 World Border: 750x750</li>
        <li>⚔️ End closed until End Fight</li>
        <li>🏠 Survival SMP</li>
        <li>🤝 Trading & Community</li>
        <li>🎯 Bounty Events</li>
    </ul>
</div>

<script>
function copyIP() {
    navigator.clipboard.writeText("thebordersmp.progamer.me");
    alert("Server IP copied!");
}

const launchDate = new Date("June 26, 2026 00:00:00").getTime();

const timer = setInterval(function() {
    const now = new Date().getTime();
    const distance = launchDate - now;

    if (distance < 0) {
        clearInterval(timer);
        document.getElementById("countdown").innerHTML =
            "<span style='color:#00ff55'>🚀 Server Is Live!</span>";
        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24))
        / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60))
        / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60))
        / 1000);

    document.getElementById("countdown").innerHTML =
        days + "d " +
        hours + "h " +
        minutes + "m " +
        seconds + "s";
}, 1000);
</script>

</body>
</html>
